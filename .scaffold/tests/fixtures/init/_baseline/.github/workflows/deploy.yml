name: Deploy

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    env:
      DEPLOY_USER_NAME: ${{ secrets.DEPLOY_USER_NAME }}
      DEPLOY_USER_EMAIL: ${{ secrets.DEPLOY_USER_EMAIL }}
      DEPLOY_REMOTE: ${{ secrets.DEPLOY_REMOTE }}
      DEPLOY_PROCEED: ${{ secrets.DEPLOY_PROCEED }}

    steps:
      - name: Checkout code
        uses: actions/checkout@__HASH__ # __VERSION__
        with:
          fetch-depth: 0

      - name: Install SSH key
        uses: shimataro/ssh-key-action@__HASH__ # __VERSION__
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: unnecessary
          config: |
            Host *
              StrictHostKeyChecking no

      - name: Deploy to Remote
        env:
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          IS_PR: ${{ github.event.pull_request && 'true' || 'false' }}
        run: |
          if [ "${IS_PR}" = "true" ]; then
            REF="${HEAD_REF}"
          else
            REF="${REF_NAME}"
          fi
          DEPLOY_BRANCH="${DEPLOY_BRANCH:-${REF}}" .devtools/deploy
