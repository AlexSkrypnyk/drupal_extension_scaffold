name: Deploy

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-24.04

    env:
      DEPLOY_USER_NAME: ${{ secrets.DEPLOY_USER_NAME }}
      DEPLOY_USER_EMAIL: ${{ secrets.DEPLOY_USER_EMAIL }}
      DEPLOY_REMOTE: ${{ secrets.DEPLOY_REMOTE }}
      DEPLOY_PROCEED: ${{ secrets.DEPLOY_PROCEED }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install SSH key
        uses: shimataro/ssh-key-action@6b84f2e793b32fa0b03a379cadadec75cc539391 # v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: unnecessary
          config: |
            Host *
              StrictHostKeyChecking no

      - name: Deploy to Remote
        env:
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          REF=${{ github.event.pull_request && env.HEAD_REF || github.ref_name }}
          DEPLOY_BRANCH=${DEPLOY_BRANCH:-${REF}} .devtools/deploy
