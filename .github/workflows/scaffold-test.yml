name: Test Scaffold

# Workflow to **validate** the **integrity** of the scaffold template itself.

on:
  push:
    branches:
      - 1.x

  pull_request:
    branches:
      - 1.x
      - 'feature/**'

jobs:
  scaffold-test-devtools:
    runs-on: ubuntu-latest

    services:
      chrome:
        image: selenium/standalone-chromium:latest@sha256:36474a4c56765ec3d04dc4cbac57a021e0d88e89fdb5dca297a50f1100279c1a
        ports:
          - 4444:4444

    strategy:
      fail-fast: false

      matrix:
        group: ['p0', 'p1', 'p2', 'p3', 'p4']

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Upgrade sqlite3
        if: matrix.group != 'p0'
        run: |
          wget https://www.sqlite.org/2024/sqlite-autoconf-3450300.tar.gz -O /tmp/sqlite.tar.gz
          tar -xzf /tmp/sqlite.tar.gz -C /tmp
          cd /tmp/sqlite-autoconf-3450300
          ./configure CFLAGS="-DSQLITE_ENABLE_COLUMN_METADATA=1" --prefix=/usr/local
          make && sudo make install
          sudo ldconfig

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: 8.3
          extensions: gd, sqlite, pdo_sqlite
          coverage: pcov
          ini-values: pcov.directory=.

      - name: Install Ahoy
        if: matrix.group == 'p3'
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]') && architecture=$(case $(uname -m) in x86_64 | amd64) echo "amd64" ;; aarch64 | arm64 | armv8) echo "arm64" ;; *) echo "amd64" ;; esac)
          sudo wget -q https://github.com/ahoy-cli/ahoy/releases/download/v2.1.1/ahoy-bin-"${os}-${architecture}" -O /usr/local/bin/ahoy
          sudo chown "$USER" /usr/local/bin/ahoy && chmod +x /usr/local/bin/ahoy

      - name: Install PHP test dependencies
        run: composer install --no-interaction
        working-directory: .scaffold/tests

      - name: Validate composer.json
        if: matrix.group == 'p0'
        run: composer validate --strict
        working-directory: .scaffold/tests

      - name: Check composer.json is normalized
        if: matrix.group == 'p0'
        run: composer normalize --dry-run
        working-directory: .scaffold/tests

      - name: Lint PHP tests
        if: matrix.group == 'p0'
        run: composer lint
        working-directory: .scaffold/tests

      - name: Run PHP tests with coverage
        run: composer test-coverage -- --group=${{ matrix.group }}
        working-directory: .scaffold/tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBSERVER_HOST: ${{ (matrix.group == 'p3' || matrix.group == 'p4') && '0.0.0.0' || 'localhost' }}

      - name: Upload coverage report as an artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{github.job}}-code-coverage-report-${{ matrix.group }}
          path: .scaffold/tests/.logs
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          directory: .scaffold/tests/.logs
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  scaffold-test-actions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check coding standards with yamllint
        run: yamllint --config-file .scaffold/tests/.yamllint-for-gha.yml .github/workflows
        continue-on-error: ${{ vars.DREVOPS_CI_YAMLLINT_IGNORE_FAILURE == '1' }}

      - name: Check coding standards with actionlint
        run: docker run --rm -v "${GITHUB_WORKSPACE:-.}":/app --workdir /app rhysd/actionlint:1.7.11 -ignore 'SC2002:' -ignore 'SC2155:'
        continue-on-error: ${{ vars.DREVOPS_CI_ACTIONLINT_IGNORE_FAILURE == '1' }}
